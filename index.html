<!DOCTYPE html>
<html>
    <head>
        <tilte>Campus</tilte>
        <style>
body{
  font-family: Arial;
  background:#f4f7fb;
  margin:40px;
}

h1{ color:#0b5ed7; }

fieldset{
  background:white;
  border:2px solid #0b5ed7;
  border-radius:10px;
  padding:20px;
}

input,select{
  width:250px;
  padding:8px;
  margin:6px 0;
}

button{
  background:#0b5ed7;
  color:white;
  padding:10px 18px;
  border:none;
  border-radius:6px;
}
</style>
    </head>
    <body>
        <h1>Campus lost found</h1>
        <p>Report or find lost items at LPU<br>
            <p>Test by Manvi</p>
            
    <fieldset>
        <legend><b>Report Lost item</b></legend>
        <form action="/submit" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
            <br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <br>

            <label for="depart">Department</label>
            <select id="depart" name="depart">
                <option value="btech">Bachelor's in technology</option>
                <option value="law and management">Law and management</option>
                <option value="designing">Designing</option>
                <option value="others">Others</option>
            </select>
            <br>

            <label for="lost">Lost item</label>
            <input type="text" id="lost" name="lost" required>
            <br>

            <label for="place">lost item'place</label>
            <input type="text" id="place" name="place" required>
            <br>

            <label for="lost date">Lost date</label>
            <input type="date" id="lost date" required>
            <br>
            <button type="submit">Report lost item</button>
        </form></fieldset></p>

        <h2>Recently found items:</h2>
        <ul>
            <li>Watch</li>
            <li>Student calculator</li>
            <li>Student Id card</li>
        </ul>

        <h2>If anyone able to found out his watch please click the button which you see below:</h2>
        <button type="click">Report found item</button>

    </body>
</html>
